name: Neural framework checks
on: [push, pull_request]
jobs:
  neural:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [torch, tensorflow]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,neural-${{ matrix.backend }}]'
      - run: python -m pytest tests/test_neural.py -q
      - run: python -m pip check
